[package]
name = "nozey"
version = "0.3.0"
description = "The cozy virtual scrapbook"
authors = []
edition = "2021"

[package.metadata.bundle]
identifier = "com.nozey.app"

[lib]
name = "nozey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
